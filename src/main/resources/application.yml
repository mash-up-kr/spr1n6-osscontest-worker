spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # OpenProxy aidocs 풀 크기(10)를 넘지 않게 잡는다.
      maximum-pool-size: 5
      connection-timeout: 5000
      max-lifetime: 1800000
      keepalive-time: 30000
      # OpenProxy 1.1.3 은 풀의 default_role 을 접속 때 적용하지 않아 연결마다 직접 정한다. 이 한 문장만 둔다.
      connection-init-sql: "SET SERVER ROLE TO 'default'"
      # Hikari 는 풀의 첫 연결에서 init SQL 보다 점검 쿼리를 먼저 보내 그 연결 하나가 실패한다.
      # 기동을 막지 않게 하고, 연결은 요청 때 다시 시도한다.
      initialization-fail-timeout: -1
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
    hibernate:
      ddl-auto: none
  ai:
    model:
      embedding: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        model: text-embedding-3-small
        dimensions: 1536
        encoding-format: float

indexing:
  retry:
    # 일반 처리 오류와 429 모두 Job claim 기준으로 최대 5회 시도한다.
    max-attempts: ${INDEXING_MAX_ATTEMPTS:5}
    # DB 예약 재시도의 선형 backoff 기준 간격. 각 회차에 ±20% 지터를 적용한다.
    base-delay: ${INDEXING_RETRY_BASE_DELAY:PT30S}
  queue:
    enabled: ${INDEXING_DB_QUEUE_ENABLED:true}
    worker-id: ${INDEXING_WORKER_ID:${random.uuid}}
    # Worker 인스턴스별 최대 claim·처리 루프 수. 작업이 있을 때만 최대치까지 늘어난다.
    concurrency: ${INDEXING_QUEUE_CONCURRENCY:5}
    # idle 워커의 새 작업 탐색 간격. 처리 중인 워커는 완료 직후 다음 claim을 한다.
    poll-interval: ${INDEXING_QUEUE_POLL_INTERVAL:PT1S}
    # idle 스레드를 1분 동안 재사용한 뒤 해제한다. 새 작업이 오면 다시 생성된다.
    worker-idle-timeout: ${INDEXING_WORKER_IDLE_TIMEOUT:PT60S}
    # heartbeat 간격의 두 배보다 길어야 시작된다. heartbeat가 한 번 늦어도 lease가 끝나지 않게 한다.
    # 기본값은 heartbeat 간격의 6배라 heartbeat가 다섯 번 연달아 실패해도 lease가 남는다.
    lease-duration: ${INDEXING_LEASE_DURATION:PT60S}
    heartbeat-interval: ${INDEXING_HEARTBEAT_INTERVAL:PT10S}
  circuit-breaker:
    name: embedding-api
    # 연속 일시 실패가 이 횟수에 도달하면 breaker를 연다.
    failure-threshold: ${INDEXING_CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
    # 열린 뒤 이 시간이 지나면 한 Worker가 시험 호출을 한다.
    open-duration: ${INDEXING_CIRCUIT_BREAKER_OPEN_DURATION:PT60S}
    # 실제 시험 호출의 TTL. spring.ai.openai.embedding.timeout(기본 60초)보다 길어야 시작된다.
    call-duration: ${INDEXING_CIRCUIT_BREAKER_CALL_DURATION:PT90S}
  database:
    # DB 장애 중 SELECT 1로 복구를 확인하는 간격이다.
    check-interval: ${INDEXING_DB_CHECK_INTERVAL:PT5S}
    # 복구 확인용 SELECT 1에만 거는 제한 시간이다. 일반 쿼리에는 적용하지 않는다.
    query-timeout: ${INDEXING_DB_QUERY_TIMEOUT:PT3S}
    connect-timeout-seconds: ${INDEXING_DB_CONNECT_TIMEOUT_SECONDS:3}
    # Worker는 일반 쿼리에 시간 제한을 걸지 않으므로 응답 없는 연결은 이 값으로 끊는다. 정상 쿼리를 끊지 않도록 넉넉히 둔다.
    socket-timeout-seconds: ${INDEXING_DB_SOCKET_TIMEOUT_SECONDS:15}
  limits:
    # 시연 환경 메모리와 임시 디스크 용량을 고려해 원문을 200 MiB로 제한한다.
    max-file-size-bytes: ${INDEXING_MAX_FILE_SIZE_BYTES:209715200}
    # 장시간 파싱이 활성 슬롯을 점유하지 않도록 60초로 제한한다.
    parse-timeout: ${INDEXING_PARSE_TIMEOUT:PT60S}
  chunking:
    # FIXED_TOKEN | PARAGRAPH | PARAGRAPH_OVERLAP
    strategy: ${INDEXING_CHUNKING_STRATEGY:FIXED_TOKEN}
    # 임베딩 모델 입력 여유를 확보하기 위해 한 청크의 본문과 헤딩을 합쳐 512토큰으로 제한한다.
    max-tokens-per-chunk: ${INDEXING_MAX_TOKENS_PER_CHUNK:512}
    # 문맥 연결용 overlap은 청크 상한의 1/8인 64토큰을 기본값으로 쓴다.
    overlap-tokens: ${INDEXING_OVERLAP_TOKENS:64}
    # 비정상 문서가 과도한 DB 행을 만들지 않도록 문서당 청크를 5천 개로 제한한다.
    max-chunks-per-document: ${INDEXING_MAX_CHUNKS:5000}
    # 단일 문서가 임베딩 쿼터를 독점하지 않도록 총 입력을 2백만 토큰으로 제한한다.
    max-total-tokens: ${INDEXING_MAX_TOTAL_TOKENS:2000000}
  embedding:
    # OpenAI 임베딩 API의 요청당 토큰 상한(300,000)에 맞춘 값이다.
    max-tokens-per-request: ${INDEXING_EMBEDDING_MAX_TOKENS_PER_REQUEST:300000}
  storage:
    # Core가 객체 업로드 성공 후 INDEX Job을 등록하는 계약을 확인한 경우만 true로 설정한다.
    job-after-upload-confirmed: ${INDEXING_JOB_AFTER_UPLOAD_CONFIRMED:false}
    bucket: ${INDEXING_STORAGE_BUCKET}
    endpoint: ${INDEXING_STORAGE_ENDPOINT:}
    region: ${INDEXING_STORAGE_REGION:us-east-1}
    # 원문 다운로드가 활성 슬롯을 장시간 점유하지 않도록 30초로 제한한다.
    download-timeout: ${INDEXING_STORAGE_DOWNLOAD_TIMEOUT:PT30S}

fault-injection:
  enabled: ${FAULT_INJECTION_ENABLED:false}
  phase: ${FAULT_INJECTION_PHASE:EMBEDDING}
