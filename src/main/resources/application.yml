spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: ${INDEXING_DB_CONNECTION_TIMEOUT_MS:3000}
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
    hibernate:
      ddl-auto: none
  ai:
    model:
      embedding: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        model: text-embedding-3-small
        dimensions: 1536
        encoding-format: float

indexing:
  retry:
    # 일반 처리 실패와 API 재시도를 합쳐 최대 5회로 제한한다.
    max-attempts: ${INDEXING_MAX_ATTEMPTS:5}
    # 선형 백오프의 기준 간격이다.
    base-delay: ${INDEXING_RETRY_BASE_DELAY:PT30S}
  queue:
    enabled: ${INDEXING_DB_QUEUE_ENABLED:true}
    worker-id: ${INDEXING_WORKER_ID:${random.uuid}}
    concurrency: ${INDEXING_QUEUE_CONCURRENCY:5}
    poll-interval: ${INDEXING_QUEUE_POLL_INTERVAL:PT1S}
    lease-duration: ${INDEXING_LEASE_DURATION:PT60S}
    heartbeat-interval: ${INDEXING_HEARTBEAT_INTERVAL:PT10S}
  database:
    check-interval: ${INDEXING_DB_CHECK_INTERVAL:PT5S}
    query-timeout: ${INDEXING_DB_QUERY_TIMEOUT:PT3S}
    connect-timeout-seconds: ${INDEXING_DB_CONNECT_TIMEOUT_SECONDS:3}
    socket-timeout-seconds: ${INDEXING_DB_SOCKET_TIMEOUT_SECONDS:15}
  limits:
    # 시연 환경 메모리와 임시 디스크 용량을 고려해 원문을 200 MiB로 제한한다.
    max-file-size-bytes: ${INDEXING_MAX_FILE_SIZE_BYTES:209715200}
    # 장시간 파싱이 활성 슬롯을 점유하지 않도록 60초로 제한한다.
    parse-timeout: ${INDEXING_PARSE_TIMEOUT:PT60S}
  chunking:
    # FIXED_TOKEN | PARAGRAPH | PARAGRAPH_OVERLAP
    strategy: ${INDEXING_CHUNKING_STRATEGY:FIXED_TOKEN}
    # 임베딩 모델 입력 여유를 확보하기 위해 한 청크의 본문과 헤딩을 합쳐 512토큰으로 제한한다.
    max-tokens-per-chunk: ${INDEXING_MAX_TOKENS_PER_CHUNK:512}
    # 문맥 연결용 overlap은 청크 상한의 1/8인 64토큰을 기본값으로 쓴다.
    overlap-tokens: ${INDEXING_OVERLAP_TOKENS:64}
    # 비정상 문서가 과도한 DB 행을 만들지 않도록 문서당 청크를 5천 개로 제한한다.
    max-chunks-per-document: ${INDEXING_MAX_CHUNKS:5000}
    # 단일 문서가 임베딩 쿼터를 독점하지 않도록 총 입력을 2백만 토큰으로 제한한다.
    max-total-tokens: ${INDEXING_MAX_TOTAL_TOKENS:2000000}
  embedding:
    # OpenAI 임베딩 API의 요청당 토큰 상한(300,000)에 맞춘 값이다.
    max-tokens-per-request: ${INDEXING_EMBEDDING_MAX_TOKENS_PER_REQUEST:300000}
  storage:
    bucket: ${INDEXING_STORAGE_BUCKET}
    endpoint: ${INDEXING_STORAGE_ENDPOINT:}
    region: ${INDEXING_STORAGE_REGION:us-east-1}
    # 원문 다운로드가 활성 슬롯을 장시간 점유하지 않도록 30초로 제한한다.
    download-timeout: ${INDEXING_STORAGE_DOWNLOAD_TIMEOUT:PT30S}

fault-injection:
  enabled: ${FAULT_INJECTION_ENABLED:false}
  phase: ${FAULT_INJECTION_PHASE:EMBEDDING}
