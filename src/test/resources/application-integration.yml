spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD:}
    hikari:
      # 전용 PostgreSQL 에서는 운영 OpenProxy 의 SET SERVER ROLE 을 실행하지 않는다.
      connection-init-sql: ""
      initialization-fail-timeout: 1
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:unused}

indexing:
  storage:
    bucket: ${INDEXING_STORAGE_BUCKET:integration-test}
    endpoint: ${INDEXING_STORAGE_ENDPOINT:}
    region: ${INDEXING_STORAGE_REGION:us-east-1}
